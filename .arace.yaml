version: 2

# 工作树隔离与依赖配置
workspace:
  prepare_cmd: "npm test" # 依赖初始化或准备命令
  test_paths:
    - "test/**"
    - "tests/**"
    - "src/**/*.spec.ts"
    - "src/**/*.test.ts"
    - "src/**/*.spec.js"
    - "src/**/*.test.js"

# 独占硬性门禁流水线
verify:
  build_cmd: ""
  lint_cmd: ""
  test_cmd: "npm test"
  timeout_per_step: 180s

# 默认协同参数
defaults:
  mode: orchestration
  supervisor: antigravity
  agents:
    - antigravity
    - opencode
    - reasonix
  timeout: 600s

